<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1060" viewBox="0 0 1200 1060" role="img">
<title>分块前后都得到 30：先合并分子、分母，最后相除</title>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="600" y="45.0" font-family="Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="34" fill="#172b4d" text-anchor="middle" dominant-baseline="central">同一组数据，两种执行顺序，结果都是 30</text>
<rect x="100" y="100" width="1000" height="115" rx="18" fill="#eaf3ff" stroke="#7da8dd" stroke-width="1.5"/>
<text x="600.0" y="134.5" font-family="Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="30" fill="#172b4d" text-anchor="middle" dominant-baseline="central">指数权重 w = [1, 2, 3, 4]</text>
<text x="600.0" y="180.5" font-family="Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="30" fill="#172b4d" text-anchor="middle" dominant-baseline="central">信息数值 V = [10, 20, 30, 40]</text>
<text x="600" y="265.0" font-family="Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="28" fill="#172b4d" text-anchor="middle" dominant-baseline="central">一次性计算：分子 300，分母 10，输出 300 / 10 = 30</text>
<polyline points="600,305 600,355" fill="none" stroke="#8393a7" stroke-width="2"/>
<polygon points="600,355 606.2325320018547,343.5914266954251 593.7674679981453,343.5914266954252" fill="#8393a7"/>
<text x="600" y="400.0" font-family="Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="30" fill="#172b4d" text-anchor="middle" dominant-baseline="central">分成两轮：每轮马上累计，不必保存旧得分</text>
<rect x="65" y="470" width="480" height="190" rx="18" fill="#eaf3ff" stroke="#7da8dd" stroke-width="1.5"/>
<text x="305.0" y="522.0" font-family="Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="28" fill="#172b4d" text-anchor="middle" dominant-baseline="central">第一轮：A、B</text>
<text x="305.0" y="565.0" font-family="Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="28" fill="#172b4d" text-anchor="middle" dominant-baseline="central">分子 1×10 + 2×20 = 50</text>
<text x="305.0" y="608.0" font-family="Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="28" fill="#172b4d" text-anchor="middle" dominant-baseline="central">分母 1 + 2 = 3</text>
<rect x="655" y="470" width="480" height="190" rx="18" fill="#eaf3ff" stroke="#7da8dd" stroke-width="1.5"/>
<text x="895.0" y="522.0" font-family="Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="28" fill="#172b4d" text-anchor="middle" dominant-baseline="central">第二轮：C、D</text>
<text x="895.0" y="565.0" font-family="Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="28" fill="#172b4d" text-anchor="middle" dominant-baseline="central">分子 3×30 + 4×40 = 250</text>
<text x="895.0" y="608.0" font-family="Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="28" fill="#172b4d" text-anchor="middle" dominant-baseline="central">分母 3 + 4 = 7</text>
<polyline points="305,660 305,735 600,735 600,790" fill="none" stroke="#8393a7" stroke-width="2"/>
<polygon points="600,790 606.2325320018547,778.5914266954252 593.7674679981453,778.5914266954252" fill="#8393a7"/>
<polyline points="895,660 895,735 600,735 600,790" fill="none" stroke="#8393a7" stroke-width="2"/>
<polygon points="600,790 606.2325320018547,778.5914266954252 593.7674679981453,778.5914266954252" fill="#8393a7"/>
<rect x="220" y="790" width="760" height="170" rx="18" fill="#e8f5ed" stroke="#7caf8a" stroke-width="1.5"/>
<text x="600.0" y="829.0" font-family="Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="30" fill="#172b4d" text-anchor="middle" dominant-baseline="central">合并：u = 50 + 250 = 300</text>
<text x="600.0" y="875.0" font-family="Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="30" fill="#172b4d" text-anchor="middle" dominant-baseline="central">合并：l = 3 + 7 = 10</text>
<text x="600.0" y="921.0" font-family="Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="30" fill="#172b4d" text-anchor="middle" dominant-baseline="central">最终输出：O = u / l = 30</text>
<text x="600" y="1015.0" font-family="Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="26" fill="#52657d" text-anchor="middle" dominant-baseline="central">保留的是分子与分母，不是两块各自归一化后的平均值。</text>
</svg>